[project]
name = "federated-online-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tables>=3.11.1",
    "torch==2.11.0",
    "torch-geometric>=2.7.0",
    "torch-scatter>=2.1.2",
    "xlsxwriter>=3.2.9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pyg-cu128"
url = "https://data.pyg.org/whl/torch-2.11.0+cu128.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torch-scatter = { index = "pyg-cu128" }
